[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-reader-selfhosted"
version = "1.0.0"
description = "Self-hosted Douyin speech-to-text workflow for iPhone Shortcuts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.31.0",
    "ffmpeg-python>=0.2.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["douyin_mcp_server*"]
