[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-reader-mcp"
version = "1.0.0"
description = "Self-hosted Douyin speech-to-text workflow for iPhone Shortcuts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "ffmpeg-python>=0.2.0",
    "mcp>=1.28,<2",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "dashscope>=1.20.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["douyin_mcp_server*"]
